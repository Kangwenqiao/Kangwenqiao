name: Generate 3D contribution graph

on:
  schedule:
    - cron: "47 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/profile-3d.yml"

permissions:
  contents: write

concurrency:
  group: contribution-3d
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v5

      - name: Generate animated 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit generated graphs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add profile-3d-contrib/
          if git diff --cached --quiet; then
            echo "No graph changes to commit."
          else
            git commit -m "chore: update 3D contribution graph"
            git push
          fi
