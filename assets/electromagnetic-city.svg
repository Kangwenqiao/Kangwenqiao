<svg width="1200" height="260" viewBox="0 0 1200 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Wenqiao Kang</title>
  <desc id="desc">A restrained electromagnetic city signal visual for an AI systems builder.</desc>
  <style>
    .signal {
      stroke-dasharray: 18 10;
      animation: signal-flow 5s linear infinite;
    }
    .spark {
      animation: spark-pulse 2.4s steps(2, end) infinite;
      transform-origin: 832px 67px;
    }
    @keyframes signal-flow { to { stroke-dashoffset: -56; } }
    @keyframes spark-pulse { 50% { opacity: 0.45; transform: scale(0.94); } }
    @media (prefers-reduced-motion: reduce) {
      .signal, .spark { animation: none; }
    }
  </style>

  <rect width="1200" height="260" rx="6" fill="#071727"/>
  <rect x="1" y="1" width="1198" height="258" rx="5" stroke="#8BE9FF" stroke-opacity=".26"/>

  <g opacity=".16" stroke="#8BE9FF">
