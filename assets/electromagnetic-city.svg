  <path d="M520 205L576 158L620 184L692 104L740 136L810 48" stroke="#FF6B78" stroke-width="3"/>
  <path class="spark" d="M805 52L847 29L830 73L875 60L837 103" stroke="#FFF" stroke-width="4" stroke-linejoin="round"/>

  <g fill="#8BE9FF" opacity=".62">
    <circle cx="1030" cy="56" r="2"/>
    <circle cx="1080" cy="94" r="3"/>
    <circle cx="1128" cy="42" r="2"/>
    <circle cx="930" cy="112" r="2"/>
